name: credentials
version: "0.1.0"
description: Prepares optional user credentials at startup for netrc, secret files and SSH CA.
artifacts:
  - name: credentials-netrc-hook
    path: files/netrc.sh
    target: credentials-netrc.sh
    dest: /tmp/artifacts/
  - name: credentials-secret-file-hook
    path: files/secret-file.sh
    target: credentials-secret-file.sh
  - name: credentials-ssh-vault-hook
    path: files/ssh-vault-ca.sh
    target: credentials-ssh-vault-ca.sh
  - name: credentials-entrypoint
    path: files/entrypoint.sh
    target: credentials-entrypoint.sh
execute:
  - script: install.sh
modules:
  install:
    - name: entrypoint
    - name: vault
