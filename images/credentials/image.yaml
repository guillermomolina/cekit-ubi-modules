schema_version: 1
name: localhost/examples/credentials
version: latest
description: credentials example using public CEKit UBI modules.
from: docker.io/redhat/ubi10-minimal:latest
args:
- name: VAULT_VERSION
  value: 1.21.2
modules:
  repositories:
  - path: ../../modules
  install:
  - name: credentials
envs:
- name: VERBOSE_BOOT
  value: 'no'
run:
  entrypoint:
  - /credentials-entrypoint.sh
  cmd:
  - /bin/sh
