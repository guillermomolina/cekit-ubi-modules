schema_version: 1
name: localhost/examples/container-tools
version: latest
description: container-tools example using public CEKit UBI modules.
from: docker.io/redhat/ubi10-minimal:latest
args:
- name: USER_NAME
  value: build
- name: USER_UID
  value: '1000'
- name: USER_GID
  value: '1000'
modules:
  repositories:
  - path: ../../modules
  install:
  - name: buildah
  - name: skopeo
envs:
- name: VERBOSE_BOOT
  value: 'no'
run:
  cmd:
  - /bin/sh
