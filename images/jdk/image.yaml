schema_version: 1
name: localhost/examples/jdk
version: latest
description: jdk example using public CEKit UBI modules.
from: docker.io/redhat/ubi10-minimal:latest
args:
- name: JAVA_MAJOR_VERSION
  value: '21'
modules:
  repositories:
  - path: ../../modules
  install:
  - name: entrypoint
  - name: jdk
envs:
- name: VERBOSE_BOOT
  value: 'no'
run:
  cmd:
  - /bin/sh
