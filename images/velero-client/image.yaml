schema_version: 1
name: localhost/examples/velero-client
version: latest
description: velero-client with public module defaults.
from: docker.io/redhat/ubi10-minimal:latest
modules:
  repositories:
  - path: ../../modules
  install:
  - name: entrypoint
  - name: velero-client
run:
  cmd:
  - velero
  - version
  - --client-only
args:
- name: VELERO_VERSION
  value: 1.16.2
