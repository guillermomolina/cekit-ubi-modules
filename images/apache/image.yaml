schema_version: 1
name: localhost/examples/apache
version: latest
description: apache example using public CEKit UBI modules.
from: docker.io/redhat/ubi10-minimal:latest
modules:
  repositories:
  - path: ../../modules
  install:
  - name: entrypoint
  - name: apache
envs:
- name: VERBOSE_BOOT
  value: 'no'
run:
  cmd:
  - httpd-foreground
