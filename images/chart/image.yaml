schema_version: 1
name: localhost/examples/chart
version: latest
description: chart example using public CEKit UBI modules.
from: docker.io/redhat/ubi10-minimal:latest
args:
- name: KUBECONFORM_VERSION
  value: v0.6.7
- name: KUBE_LINTER_VERSION
  value: v0.7.2
modules:
  repositories:
  - path: ../../modules
  install:
  - name: git
  - name: helm
  - name: kubeconform
  - name: kube-linter
envs:
- name: VERBOSE_BOOT
  value: 'no'
run:
  cmd:
  - /bin/sh
